\* must break: ClearedNeverReturns
\* The code before the fixes also saved the startup content after history went
\* off and on (StartupNeverSaved). This config checks the cleared-copy rule
\* alone, so it shows that the model catches a cleared copy coming back.
SPECIFICATION Spec
CONSTANTS
    EpochFirst = TRUE
    Counted = FALSE
    Fixed = FALSE
    FailedFirstLookWaits = TRUE
    MaxCopies = 3
    MaxRequests = 3
INVARIANTS
    TypeOK
    NothingStaleIsSaved
    ClearedNeverReturns
