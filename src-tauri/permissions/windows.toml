# No default permission: each window receives only its explicit sets.
# Per-command allow permissions are generated by AppManifest in build.rs.

[[set]]
identifier = "launcher"
description = "Search, result actions, launcher controls, and the launcher's narrow preference actions."
permissions = [
  "allow-paste-result",
  "allow-drag-result",
  "allow-share-result",
  "allow-paste-queue",
  "allow-library-list",
  "allow-library-get",
  "allow-library-save",
  "allow-library-delete",
  "allow-library-execute",
  "allow-file-preview",
  "allow-execute-file-action",
  "allow-utility-capabilities",
  "allow-utility-processes",
  "allow-utility-prepare-process",
  "allow-utility-prepare-app",
  "allow-utility-confirm-process",
  "allow-utility-cancel-process",
  "allow-utility-color",
  "allow-utility-copy-color",
  "allow-utility-eyedropper",
  "allow-utility-awake-status",
  "allow-utility-set-awake",
  "allow-utility-media",
  "allow-utility-capture-window",
  "allow-utility-window",
  "allow-rich-clipboard-history",
  "allow-rich-clipboard-preview",
  "allow-reveal-rich-clipboard-file",
  "allow-copy-rich-clipboard",
  "allow-paste-rich-clipboard",
  "allow-delete-rich-clipboard",
  "allow-set-rich-clipboard-pinned",
  "allow-set-rich-clipboard-name",
  "allow-set-launcher-appearance",
  "allow-launcher-ready",
  "allow-choose-clipboard-history",
  "allow-set-app-preference",
  "allow-open-settings",
  "allow-search",
  "allow-cancel-search",
  "allow-set-pinned",
  "allow-refresh-apps",
  "allow-refresh-files",
  "allow-refresh-currency",
  "allow-quit-app",
  "allow-execute-action",
  "allow-clipboard-preview",
  "allow-edit-clipboard-history",
  "allow-copy-clipboard-selection",
  "allow-save-clipboard-file",
  "allow-hide-launcher",
  "allow-reset-launcher-position",
]

[[set]]
identifier = "settings"
description = "Preferences form, application catalog, web search preview, portability, and explicit updates."
permissions = [
  "allow-get-settings",
  "allow-save-settings",
  "allow-item-catalog",
  "allow-preview-web-search",
  "allow-set-shortcut-recording",
  "allow-reveal-settings-path",
  "allow-export-settings",
  "allow-preview-settings-import",
  "allow-reveal-backup",
  "allow-check-update",
  "allow-install-update",
]

[[set]]
identifier = "shared"
description = "Both windows offer history clearing, application selection, and validated appearance synchronization."
permissions = [
  "allow-app-catalog",
  "allow-clear-clipboard-history",
  "allow-sync-appearance",
]
