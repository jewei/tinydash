[package]
name = "tinydash"
# 0.0.0 between releases: the Release workflow sets the real version with
# scripts/set-version.ts, so no commit is needed to release.
version = "0.0.0"
description = "A small, keyboard-first desktop launcher"
license = "MIT"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "tinydash_lib"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.0"
# Focus timer notifications, sent from Rust; the webview has no permission.
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
# native-tls like ureq. No zip: macOS updates are tar.gz, which the plugin
# always reads, and the Windows update is the setup program itself.
tauri-plugin-updater = { version = "2.13.1", default-features = false, features = ["native-tls", "system-proxy"] }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
emojis = "0.9.0"
fend-core = "1.5.8"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2.0"
nucleo-matcher = "0.3.1"
percent-encoding = "2.3.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
url = "2.5.8"
walkdir = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSURL", "NSValue"] }
plist = "1.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Shutdown", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri 2 links GTK 0.18; these bindings must match it.
gio = "0.18.4"
gtk = "0.18.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
