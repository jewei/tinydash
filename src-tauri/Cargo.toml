[package]
name = "tinydash"
version = "0.1.2"
license = "MIT"
description = "A small keyboard-first desktop application launcher"
edition = "2024"
rust-version = "1.98.1"

[lib]
name = "tinydash_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-clipboard-manager = "2.3.3"
emojis = "0.9.0"
fend-core = "1.5.8"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup"] }
tar = "0.4.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo-matcher = "0.3.1"
unicode-normalization = "0.1.25"
walkdir = "2.5"
notify = "8.2.0"
# Reuse the HTTP client already in Tauri's dependency tree and the OS TLS stack.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-no-alpn"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
getrandom = "0.3.4"
chrono = "0.4.45"
chrono-tz = "0.10.4"
url = "2.5"
zeroize = "1.8"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = { version = "2.11.0", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSAppearance", "NSGlassEffectView", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "AE", "AEDataModel", "AEMach", "AERegistry"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Shutdown", "Win32_System_Power", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
# GIO is used independently for application discovery and D-Bus commands.
gio = "0.22.9"
gio-unix = "0.22.8"
# Tauri requires GTK 0.18. GTK 0.19 conflicts over the native `gtk-3` link.
gtk = "0.18.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# macOS 27 rejects stripped proc-macro dylibs with some Rust/LLVM versions.
# Keep build tools intact while still stripping the shipped application.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
strip = "none"
