# Cargo reads this from the working directory upward, so it applies both at
# the repository root (`--manifest-path src-tauri/Cargo.toml`) and in src-tauri.
# ts-rs writes TypeScript bindings for IPC types here when `cargo test` runs.
[env]
TS_RS_EXPORT_DIR = { value = "src/generated", relative = true }
TS_RS_LARGE_INT = "number"
