version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"] }
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      javascript: { patterns: ["*"] }
    # Vite+ pins vite and vitest through overrides; upgrade all three with `bunx vp migrate`.
    ignore:
      - dependency-name: vite-plus
      - dependency-name: vite
      - dependency-name: vitest
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
