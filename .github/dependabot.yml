version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # CodeQL stops when its init, analyze, and upload-sarif steps run different
    # versions, so they update in one PR.
    groups:
      codeql: { patterns: ["github/codeql-action*"] }
