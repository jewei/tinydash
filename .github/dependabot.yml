version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # One PR for every action. It also keeps CodeQL's init and analyze steps
    # on the same version, which CodeQL needs.
    groups:
      actions: { patterns: ["*"] }
