version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"] }
    # The Tauri CLI refuses a tauri crate and @tauri-apps packages of different
    # minor versions, and Dependabot cannot update both in one PR.
    ignore:
      - dependency-name: tauri
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      javascript: { patterns: ["*"] }
    # Vite+ pins vite and vitest through overrides; upgrade all three with `bunx vp migrate`.
    ignore:
      - dependency-name: vite-plus
      - dependency-name: vite
      - dependency-name: vitest
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
