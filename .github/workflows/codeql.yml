name: CodeQL

# Results go to Security > Code scanning. Branch protection does not require
# this workflow, so a finding is reviewed there and never blocks a merge.
# Docs and images are not analyzed. The schedule is monthly; pull requests
# and main still scan the code they change.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".claude/**"
      - "**/*.png"
      - "**/*.avif"
      - "**/*.svg"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".claude/**"
      - "**/*.png"
      - "**/*.avif"
      - "**/*.svg"
  schedule:
    - cron: "41 4 1 * *"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true
      - name: Remember the Go build cache path
        if: matrix.language == 'go'
        id: gocache
        shell: bash
        run: echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.language == 'go'
        with:
          path: ${{ steps.gocache.outputs.path }}
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Go is analyzed while it builds; Actions needs no build.
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
