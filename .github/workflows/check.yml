name: Checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.paths.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - id: paths
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          FORCE_SOURCE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: bun scripts/verify/checks.ts changes

  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:repo
      - run: bun run format:check
      - run: bun scripts/verify/docs.ts
      - run: bun test scripts/verify/checks.test.ts scripts/verify/docs.test.ts scripts/release/evidence.test.ts

  quick:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup component add rustfmt
      - run: bun install --frozen-lockfile
      - run: bunx --bun --no-install playwright install --with-deps chromium
      - run: bun run verify
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quick-verification
          path: test-results/verification/
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - name: Install Rust tools
        run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Check synthetic performance harness (not a latency gate)
        if: runner.os == 'Linux'
        run: |
          cargo check --manifest-path scripts/perf/file-index/Cargo.toml --locked
          cargo check --manifest-path scripts/perf/file-index/Cargo.toml --locked --features track-allocations
      - name: Build application and installer
        run: bun scripts/verify/build.ts
      - name: Check macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p test-results
          bash scripts/ci/check-dmg.sh | tee test-results/dmg-check.txt
      - name: Prepare downloadable build
        run: bun scripts/ci/artifacts.ts prepare artifacts/packages
      - name: Verify build checksums
        run: bun scripts/ci/artifacts.ts verify artifacts/packages
      - name: Upload native build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TinyDash-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
      - name: Install browser for UI tests
        if: runner.os == 'Linux'
        run: bunx --bun --no-install playwright install --with-deps chromium
      - name: Test UI
        if: runner.os == 'Linux'
        run: bun run test:ui
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}-${{ runner.arch }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  native:
    needs: [changes, desktop]
    if: needs.changes.outputs.source == 'true' && needs.desktop.result == 'success'
    uses: ./.github/workflows/native.yml
    with:
      build_run_id: ${{ github.run_id }}

  required:
    name: Required checks
    if: always()
    needs: [changes, repository, quick, desktop, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Reject failures and unintended skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bun scripts/verify/checks.ts required
