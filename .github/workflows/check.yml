name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - name: Install Rust tools
        run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: rustfmt --check --edition 2024 tests/native/fixture.rs
      - run: bun run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: bun run tauri build --bundles app
      - name: Build Windows or Linux binary
        if: runner.os != 'macOS'
        run: bun run tauri build --no-bundle
      - name: Prepare downloadable build
        shell: bash
        run: |
          mkdir -p artifacts
          case "$RUNNER_OS" in
            macOS)
              ditto -c -k --keepParent src-tauri/target/release/bundle/macos/TinyDash.app "artifacts/TinyDash-macos-$RUNNER_ARCH.zip"
              ;;
            Windows)
              cp src-tauri/target/release/tinydash.exe "artifacts/TinyDash-windows-$RUNNER_ARCH.exe"
              ;;
            Linux)
              tar -C src-tauri/target/release -czf "artifacts/TinyDash-linux-$RUNNER_ARCH.tar.gz" tinydash
              ;;
          esac
          cp docs/desktop-checks.md artifacts/
          printf '%s\n' "Commit: $GITHUB_SHA" "OS: $RUNNER_OS" "Architecture: $RUNNER_ARCH" > artifacts/build.txt
      - name: Upload native build
        uses: actions/upload-artifact@v7
        with:
          name: TinyDash-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Install browser for UI tests
        if: runner.os == 'Linux'
        run: bunx --bun --no-install playwright install --with-deps chromium
      - name: Test UI
        if: runner.os == 'Linux'
        run: bun run test:ui
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}-${{ runner.arch }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  native:
    needs: desktop
    uses: ./.github/workflows/native.yml
    with:
      build_run_id: ${{ github.run_id }}
