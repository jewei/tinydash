name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - name: Install Rust tools
        run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: rustfmt --check --edition 2024 tests/native/fixture.rs
      - run: bun run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build application and installer
        run: bun run tauri build
      - name: Check macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p test-results
          bash scripts/ci/check-dmg.sh | tee test-results/dmg-check.txt
      - name: Prepare downloadable build
        run: bun scripts/ci/artifacts.ts prepare artifacts/packages
      - name: Verify build checksums
        run: bun scripts/ci/artifacts.ts verify artifacts/packages
      - name: Upload native build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: TinyDash-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
      - name: Install browser for UI tests
        if: runner.os == 'Linux'
        run: bunx --bun --no-install playwright install --with-deps chromium
      - name: Test UI
        if: runner.os == 'Linux'
        run: bun run test:ui
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ runner.os }}-${{ runner.arch }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  native:
    needs: desktop
    uses: ./.github/workflows/native.yml
    with:
      build_run_id: ${{ github.run_id }}
