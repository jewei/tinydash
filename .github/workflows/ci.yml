name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A change to Markdown or docs/ alone has no code to build or test, so the
  # other jobs skip their slow steps. Unknown history counts as code.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! changed=$(git diff --name-only "$BASE" "$GITHUB_SHA"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Also checks Markdown formatting, so it runs for docs too.
      - run: bunx vp check
      - run: bunx vp test
        if: needs.changes.outputs.code == 'true'
      - run: bunx vp build
        if: needs.changes.outputs.code == 'true'

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os == 'Linux'
        with:
          bun-version-file: package.json
      - name: Test and check generated TypeScript
        if: runner.os == 'Linux'
        run: bun scripts/bindings.ts

  # Branch protection on main requires this one name, so the job list can
  # change without a settings change. It runs even when a job fails, and
  # passes only when every job passed. A skipped job counts only for a
  # docs-only change; otherwise it fails, as a cancelled one does.
  required:
    name: Required checks
    if: always()
    needs: [changes, frontend, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "Results: $RESULTS (code changed: $CODE)"
          for result in $RESULTS; do
            [ "$result" = success ] && continue
            [ "$result" = skipped ] && [ "$CODE" = false ] && continue
            exit 1
          done
