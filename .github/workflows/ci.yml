name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request push is not also a push event: push runs only for main,
# so one commit is not tested twice while it is still on the branch.
# A new commit on a pull request cancels the run it replaces. A push to
# main waits, so a result already in progress is kept.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Docs, images, and the workflows this file does not run have nothing to
  # build. scripts/ci-changed.sh decides the rest: Linux for every code
  # change, macOS and Windows when that OS's files or the build changed.
  # A push to main runs every OS. Unknown history counts as code on every OS.
  # docs/architecture.md counts as code: TestArchitectureTableMatchesTheRules
  # reads it.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
      darwin: ${{ steps.diff.outputs.darwin }}
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the path rules
        run: bash scripts/ci-changed.sh --check
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # --no-renames lists both paths of a rename, so a code file moved
          # into docs/ still counts as a code change.
          if ! changed=$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA"); then
            {
              echo "code=true"
              echo "darwin=true"
              echo "windows=true"
            } | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          CI_CHANGED_SHA="$GITHUB_SHA" CI_CHANGED_BASE="$BASE" \
            bash scripts/ci-changed.sh "$EVENT" <<< "$changed" | tee -a "$GITHUB_OUTPUT"

  go-linux:
    name: Go (ubuntu-24.04)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps: &go-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The step below caches modules, builds, and staticcheck together.
          cache: false
      - name: Find the Go caches
        id: gocache
        shell: bash
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "lint=$RUNNER_TEMP/staticcheck"
          } >> "$GITHUB_OUTPUT"
          echo "STATICCHECK_CACHE=$RUNNER_TEMP/staticcheck" >> "$GITHUB_ENV"
      # main saves a cache under its commit, and every run restores the
      # newest one, so a pull request starts from main's latest build. A
      # key without the commit was written once and never refreshed. Pull
      # requests do not save: GitHub would scope the entry to that branch,
      # where no other run can read it, and it would push main's out of
      # the 10 GB quota.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.modules }}
            ${{ steps.gocache.outputs.lint }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      # Runtime libraries only. The app loads them with purego, so the
      # -dev packages (headers) are not needed to vet or test.
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libayatana-appindicator3-1
      - name: Vet, lint, and test
        shell: bash
        env:
          # The same test run records coverage. A second job used to repeat it.
          COVERAGE_OUT: ${{ runner.os == 'Linux' && 'coverage.out' || '' }}
        run: bash scripts/verify-go.sh
      - name: Report coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | tail -1)
          echo "$total"
          { echo '```'; echo "$total"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.modules }}
            ${{ steps.gocache.outputs.lint }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # The models need only Java, so they run beside the Go jobs instead of
  # after the Linux tests.
  formal:
    name: TLA+ models
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Model-check the TLA+ models
        run: bash scripts/formal-verify.sh

  go-macos:
    name: Go (macos-15)
    needs: changes
    if: needs.changes.outputs.darwin == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps: *go-steps

  go-windows:
    name: Go (windows-2025)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps: *go-steps

  # Branch protection on main requires this one name, so the job list can
  # change without a settings change. It runs even when a job fails, and
  # passes only when every job that had work passed. A skipped Go job is
  # expected for a docs-only change, and for an OS this diff does not build.
  # A failure or a cancellation fails the check.
  required:
    name: Required checks
    if: always()
    needs: [changes, go-linux, go-macos, go-windows, formal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          LINUX: ${{ needs.go-linux.result }}
          MACOS: ${{ needs.go-macos.result }}
          WINDOWS: ${{ needs.go-windows.result }}
          FORMAL: ${{ needs.formal.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WANT_MACOS: ${{ needs.changes.outputs.darwin }}
          WANT_WINDOWS: ${{ needs.changes.outputs.windows }}
        run: |
          echo "changes=$CHANGES linux=$LINUX macos=$MACOS windows=$WINDOWS formal=$FORMAL code=$CODE macos job=$WANT_MACOS windows job=$WANT_WINDOWS"
          fail=0
          [ "$CHANGES" = success ] || fail=1
          check() {
            result="$1"
            want="$2"
            name="$3"
            if [ "$want" = true ]; then
              if [ "$result" != success ]; then
                echo "$name is $result"
                fail=1
              fi
            elif [ "$result" != skipped ] && [ "$result" != success ]; then
              echo "$name is $result"
              fail=1
            fi
          }
          check "$LINUX" "$CODE" "Go (ubuntu-24.04)"
          check "$MACOS" "$WANT_MACOS" "Go (macos-15)"
          check "$WINDOWS" "$WANT_WINDOWS" "Go (windows-2025)"
          check "$FORMAL" "$CODE" "TLA+ models"
          exit "$fail"
