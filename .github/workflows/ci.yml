name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A change to Markdown or docs/ alone has no code to build or test, so the
  # other jobs skip their slow steps. Unknown history counts as code.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # --no-renames lists both paths of a rename, so a code file moved
          # into docs/ still counts as a code change.
          if ! changed=$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  go:
    name: Go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Vet, lint, and test
        shell: bash
        run: bash scripts/verify-go.sh
      - name: Model-check the TLA+ models
        if: runner.os == 'Linux'
        run: bash scripts/formal-verify.sh

  # Branch protection on main requires this one name, so the job list can
  # change without a settings change. It runs even when a job fails, and
  # passes only when every job passed. A skipped job counts only for a
  # docs-only change; otherwise it fails, as a cancelled one does.
  required:
    name: Required checks
    if: always()
    needs: [changes, go]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "Results: $RESULTS (code changed: $CODE)"
          for result in $RESULTS; do
            [ "$result" = success ] && continue
            [ "$result" = skipped ] && [ "$CODE" = false ] && continue
            exit 1
          done
