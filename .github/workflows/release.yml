# Started by `bun run release <version> [--draft]`, or by "Run workflow" on
# GitHub. Builds main at a commit whose CI passed, checks that the macOS app is
# signed and notarized, then tags that commit and publishes the release (or a
# draft to try first). Nothing is published unless every build passed.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.2.1
        required: true
        type: string
      draft:
        description: Make a draft to try before you publish it
        type: boolean
        default: false

concurrency: release

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Release from main, at a new version, after CI passed
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Release from main, not $GITHUB_REF."; exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "\"$VERSION\" is not a version such as 0.2.1."; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists. Choose a new version."; exit 1
          fi
          result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=Required%20checks" \
            -q '.check_runs | map(.conclusion) | if any(. == "success") then "success" else "not passed" end')
          if [ "$result" != success ]; then
            echo "CI has not passed on $GITHUB_SHA yet. Wait for it, then try again."; exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Add both Mac architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bun scripts/set-version.ts "$VERSION"
      - name: Write the update build config
        if: runner.os != 'Linux'
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: >-
          bun -e 'await Bun.write("src-tauri/tauri.release.conf.json", JSON.stringify({
          bundle: { createUpdaterArtifacts: true },
          plugins: { updater: { pubkey: process.env.TAURI_UPDATER_PUBLIC_KEY } } }))'
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          # With these, Tauri signs the macOS app with the Developer ID and
          # has Apple notarize it, so Gatekeeper opens it without a warning.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          # Updates (not on Linux, whose .deb cannot replace itself): the key
          # signs the update files, and the app is built with the feed
          # address and the public key that checks them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.os != 'Linux' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ runner.os != 'Linux' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ runner.os != 'Linux' && secrets.TAURI_UPDATER_PUBLIC_KEY || '' }}
          TINYDASH_UPDATE_ENDPOINT: ${{ runner.os != 'Linux' && vars.TINYDASH_UPDATE_ENDPOINT || '' }}
        with:
          tauriScript: bunx tauri
          # One macOS app for Apple silicon and Intel; update files on macOS
          # and Windows.
          args: >-
            ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}
            ${{ runner.os != 'Linux' && '--config src-tauri/tauri.release.conf.json' || '' }}
      - name: Check that the macOS app is signed and notarized
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/TinyDash.app
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app" 2>&1 | tee assessment.txt
          grep -q "source=Notarized Developer ID" assessment.txt
      - name: Collect the installers and update files
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir installers
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*-setup.exe.sig' -o -name '*.deb' \
            -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp {} installers/ \;
          # The macOS update file has no version in its name; give it one.
          if [ -f installers/TinyDash.app.tar.gz ]; then
            mv installers/TinyDash.app.tar.gz "installers/TinyDash_${VERSION}_universal.app.tar.gz"
            mv installers/TinyDash.app.tar.gz.sig "installers/TinyDash_${VERSION}_universal.app.tar.gz.sig"
          fi
          ls installers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.os }}
          path: installers/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Write the update feed
        working-directory: installers
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          mac="TinyDash_${VERSION}_universal.app.tar.gz"
          win="TinyDash_${VERSION}_x64-setup.exe"
          # The macOS file is universal, so both Mac architectures use it.
          jq -n --arg version "$VERSION" \
            --arg notes "See https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "$(cat "$mac.sig")" --arg mac_url "$base/$mac" \
            --arg win_sig "$(cat "$win.sig")" --arg win_url "$base/$win" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
              "darwin-x86_64": {signature: $mac_sig, url: $mac_url},
              "windows-x86_64": {signature: $win_sig, url: $win_url}}}' > latest.json
          cat latest.json
      - name: Tag the commit and publish the release
        run: |
          cd installers
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          draft=()
          if [ "$DRAFT" = true ]; then draft=(--draft); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TinyDash v$VERSION" --generate-notes "${draft[@]}" -- *
