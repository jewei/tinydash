name: Native app checks

on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      release_artifacts:
        default: false
        type: boolean
      upgrade_tag:
        default: ""
        type: string
    secrets:
      TAURI_UPDATER_PUBLIC_KEY:
        required: false
  workflow_dispatch:
    inputs:
      recovery_recipient:
        description: Temporary signing recovery recipient; leave empty for desktop checks
        default: ""
        type: string
      build_run_id:
        description: Workflow run containing the native build artifacts
        required: true
        type: string
      release_artifacts:
        description: Use packages from the Release candidate workflow
        default: false
        type: boolean
      upgrade_tag:
        description: Test an installed version upgrade to this candidate tag; leave empty for smoke checks
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  recover-signing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_recipient != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Encrypt the signing recovery file
        env:
          RECIPIENT: ${{ inputs.recovery_recipient }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { constants, createCipheriv, createPublicKey, publicEncrypt, randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          process.umask(0o077);
          const recipient = createPublicKey(Buffer.from(process.env.RECIPIENT, 'base64'));
          if (recipient.asymmetricKeyType !== 'rsa' || recipient.asymmetricKeyDetails.modulusLength < 3072) throw Error('Invalid recipient');
          if (!process.env.PRIVATE_KEY || !process.env.PUBLIC_KEY || !process.env.KEY_PASSWORD) throw Error('Missing signing secret');
          const payload = Buffer.from(JSON.stringify({
            privateKey: process.env.PRIVATE_KEY,
            password: process.env.KEY_PASSWORD,
            publicKey: process.env.PUBLIC_KEY,
          }));
          const key = randomBytes(32), nonce = randomBytes(12);
          const cipher = createCipheriv('aes-256-gcm', key, nonce);
          cipher.setAAD(Buffer.from('TinyDash updater recovery v1'));
          const ciphertext = Buffer.concat([cipher.update(payload), cipher.final()]);
          const encode = value => value.toString('base64');
          const envelope = {
            schema: 1, algorithm: 'RSA-OAEP-SHA256/AES-256-GCM',
            wrappedKey: encode(publicEncrypt({ key: recipient, oaepHash: 'sha256', padding: constants.RSA_PKCS1_OAEP_PADDING }, key)),
            nonce: encode(nonce), tag: encode(cipher.getAuthTag()), ciphertext: encode(ciphertext),
          };
          writeFileSync('updater-recovery.json', JSON.stringify(envelope) + '\n', { mode: 0o600 });
          payload.fill(0); key.fill(0);
          console.log('Encrypted recovery file created.');
          JS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: encrypted-updater-recovery
          path: updater-recovery.json
          retention-days: 1
          if-no-files-found: error

  upgrade:
    if: ${{ inputs.upgrade_tag != '' && !inputs.recovery_recipient }}
    uses: ./.github/workflows/upgrade.yml
    with:
      build_run_id: ${{ inputs.build_run_id }}
      candidate_tag: ${{ inputs.upgrade_tag }}
    secrets:
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}

  native:
    if: ${{ inputs.upgrade_tag == '' && !inputs.recovery_recipient }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TinyDash-Windows-X64
            release_artifact: release-windows
          - os: ubuntu-24.04
            artifact: TinyDash-Linux-X64
            release_artifact: release-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: native-driver
          workspaces: src-tauri
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.release_artifacts && matrix.release_artifact || matrix.artifact }}
          path: native-build/
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify downloaded build
        run: bun scripts/ci/artifacts.ts verify native-build
      - name: Record tested build
        shell: bash
        run: |
          mkdir -p test-results/native
          cp native-build/build.txt test-results/native/tested-build.txt
          printf '%s\n' "Test code: $GITHUB_SHA" > test-results/native/test-code.txt
      - name: Install Linux runtime and test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver libayatana-appindicator3-1 libxdo3 xvfb openbox dbus-x11 xclip xdg-utils desktop-file-utils scrot
      - name: Install and check Windows package
        if: runner.os == 'Windows'
        id: windows-install
        shell: pwsh
        run: ./scripts/ci/windows-installer.ps1 Install | Tee-Object test-results/native/installer.txt
      - name: Install and check Linux package
        if: runner.os == 'Linux'
        id: linux-install
        shell: bash
        run: bash scripts/ci/linux-installer.sh install | tee test-results/native/installer.txt
      - name: Install native test driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Install matching WebView2 driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-edge-driver.ps1
      - name: Test native Windows application
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/ci/test-windows.ps1
      - name: Test native Linux application
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          GDK_BACKEND: x11
          XDG_SESSION_TYPE: x11
          # Xvfb does not provide the DMA-BUF renderer used on a GPU desktop.
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash -c 'openbox & exec bun run verify:native'
      - name: Remove and check Windows package
        if: always() && steps.windows-install.outcome == 'success'
        shell: pwsh
        run: ./scripts/ci/windows-installer.ps1 Remove | Tee-Object -Append test-results/native/installer.txt
      - name: Remove and check Linux package
        if: always() && steps.linux-install.outcome == 'success'
        shell: bash
        run: bash scripts/ci/linux-installer.sh remove | tee -a test-results/native/installer.txt
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-results-${{ runner.os }}-${{ runner.arch }}
          path: |
            test-results/native/
            test-results/verification/
          if-no-files-found: ignore
          retention-days: 14
