name: Native app checks

on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Checks run containing the native build artifacts
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TinyDash-Windows-X64
            binary: tinydash.exe
          - os: ubuntu-24.04
            artifact: TinyDash-Linux-X64
            binary: tinydash
    runs-on: ${{ matrix.os }}
    env:
      TINYDASH_NATIVE_BINARY: ${{ github.workspace }}/native-build/${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-driver
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: native-build/
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare native binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            mv native-build/TinyDash-windows-X64.exe native-build/tinydash.exe
          else
            tar -xzf native-build/TinyDash-linux-X64.tar.gz -C native-build
          fi
          mkdir -p test-results/native
          cp native-build/build.txt test-results/native/tested-build.txt
          printf '%s\n' "Test code: $GITHUB_SHA" > test-results/native/test-code.txt
      - name: Install Linux runtime and test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver libayatana-appindicator3-1 libxdo3 xvfb openbox dbus-x11
      - name: Install native test driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Install matching WebView2 driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-edge-driver.ps1
      - name: Test native Windows application
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: bun run test:native
      - name: Test native Linux application
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          GDK_BACKEND: x11
          XDG_SESSION_TYPE: x11
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" bash -c 'openbox & exec bun run test:native'
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-results-${{ runner.os }}-${{ runner.arch }}
          path: test-results/native/
          if-no-files-found: ignore
          retention-days: 14
