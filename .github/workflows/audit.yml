name: Audit

# Advisories appear without any change here, so this runs weekly rather
# than on pull requests, where a new advisory would block unrelated work.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      # Fails on a known vulnerability; unmaintained or unsound crates are
      # listed as warnings, as Tauri pins some (GTK 0.18 on Linux).
      - name: Audit Cargo.lock
        run: cargo audit --file src-tauri/Cargo.lock
